events {
    worker_connections 1024;
}

http {
    upstream backend_api {
        server api1:8080;
        server api2:8080;
    }

    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        # ✅ NOUVEAU : On lève la limite de Nginx à 20 Mo.
        # C'est ton backend Go (MaxBytesReader configuré à 15 Mo) qui tranchera avec précision.
        client_max_body_size 20M;

        # Chemins vers les certificats montés via Docker
        ssl_certificate /etc/nginx/certs/nginx-cert.pem;
        ssl_certificate_key /etc/nginx/certs/nginx-key.pem;

        # =================================================================
        # LE BOUCLIER ANTI FAUX-WIFI (HSTS)
        # Force les clients à n'utiliser QUE du HTTPS/WSS pendant 1 an
        # =================================================================
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        location /internal_minio/ {
            internal;
            rewrite ^/internal_minio/(.*) /$1 break;
            proxy_pass http://minio:9000;
            proxy_set_header Host minio:9000;
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-id-2;
        }

        location /process {
            proxy_pass http://watermark:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}